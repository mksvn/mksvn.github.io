<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found</title>
  <script>
    // The old site moved to /old. Send old URLs to their new home.
    (function () {
      var p = location.pathname;
      var moved = ['/projects/', '/img/', '/css/', '/js/'];
      var isOld = p === '/coming.html' || moved.some(function (prefix) { return p.indexOf(prefix) === 0; });
      if (isOld) location.replace('/old' + p + location.search + location.hash);
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a0a0a; color: #ebe5d1; font-family: system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    a { color: #00d4ca; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p><a href="/">Go to the home page</a></p>
  </main>
</body>
</html>
